<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mother Illustration Beautiful Test</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-[#F5F2EF] m-0 p-8 flex flex-col items-center justify-center min-h-screen">

  <!-- Mock Footer Container (White section on top, Dark wave on bottom) -->
  <div class="w-[340px] relative bg-white border border-[#F0EAE6] shadow-xl rounded-2xl overflow-hidden flex flex-col">
    <!-- Top White Section where text and illustration live -->
    <div class="relative w-full h-[320px] bg-[#FDFCFB] overflow-hidden">
      
      <!-- Top Script Text: Real mums. Real stories. Real support. ♡ -->
      <div class="absolute top-4 right-4 z-20 text-right select-none transform -rotate-3">
        <p class="font-['Caveat'] text-[#9C4B5E] text-[20px] leading-[1.15] font-semibold tracking-wide">
          Real mums.<br />
          Real stories.<br />
          Real support.
        </p>
        <div class="flex items-center justify-end gap-1.5 mt-0.5 pr-1">
          <span class="w-8 h-[1.5px] bg-[#9C4B5E]/50 rounded-full"></span>
          <svg class="w-4 h-4 text-[#9C4B5E] stroke-current fill-none inline-block transform rotate-12" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
          </svg>
        </div>
      </div>

      <!-- Mother & Baby Line Art (Positioned at bottom-0 right-0, FULLY TOUCHING THE BOTTOM) -->
      <div class="absolute right-0 bottom-0 w-[240px] h-[250px] z-10 pointer-events-none select-none">
        <svg class="w-full h-full block" viewBox="0 0 240 250" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Soft Organic Blush Circle Blob -->
          <path d="M125 45 C175 32, 225 65, 235 125 C242 175, 215 220, 175 235 C135 250, 85 235, 70 190 C55 145, 75 58, 125 45 Z" fill="#FAF0ED" opacity="0.9" />

          <!-- Left Floating Outline Heart -->
          <g transform="translate(45, 115) rotate(-12) scale(0.68)">
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" stroke="#BA727E" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
          </g>

          <!-- Right Floating Outline Heart -->
          <g transform="translate(198, 95) rotate(15) scale(0.72)">
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" stroke="#BA727E" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
          </g>

          <!-- Beautiful Clean Minimalist Mother & Child Line Art -->
          <g stroke="#9C4B5E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
            <!-- Mother's Hair Waves & Crown -->
            <path d="M150 48 C166 40, 184 46, 192 60 C202 75, 204 95, 196 112 C190 124, 182 134, 184 148 C186 164, 198 184, 204 204 C208 218, 212 234, 214 250" />
            <path d="M162 45 C180 54, 190 72, 188 92 C186 110, 175 125, 172 142" stroke-width="1.8" />
            <path d="M140 56 C134 62, 132 68, 134 76" stroke-width="1.8" />

            <!-- Mother's Delicate Profile (Forehead, Slender Nose, Lips, Chin) -->
            <path d="M148 48 C140 56, 138 66, 142 74 C144 76, 147 78, 146 80 C144 82, 140 83, 141 86 C143 89, 146 90, 145 92 C145 95, 141 97, 144 102 C148 107, 156 110, 160 118" />

            <!-- Mother's Serene Eyelash Line (Peaceful & Loving) -->
            <path d="M146 70 Q151 74 156 71" stroke-width="2" />
            <path d="M154 73 L157 76" stroke-width="1.6" />
            <path d="M151 74 L153 78" stroke-width="1.6" />

            <!-- Mother's Sweet Smile -->
            <path d="M144 91 Q148 94 153 92" stroke-width="1.8" />

            <!-- Mother's Neck & Shoulder Line flowing down to bottom -->
            <path d="M168 116 C178 126, 196 142, 206 162 C218 185, 226 215, 230 250" />

            <!-- Mother's Loving Arm Wrapping Around Baby -->
            <path d="M198 168 C188 188, 162 205, 136 212 C120 216, 106 212, 94 202" />
            <path d="M190 158 C178 174, 152 186, 132 186 C122 186, 112 180, 104 170" />

            <!-- Mother's Hand Tenderly Cradling Baby -->
            <path d="M94 202 C88 198, 84 190, 86 182 C88 174, 94 168, 100 164" />
            <path d="M86 186 C82 182, 80 176, 82 170 C85 164, 92 162, 98 162" stroke-width="1.8" />

            <!-- Baby's Round Head Nestled into Mother's Chest -->
            <path d="M116 112 C108 114, 100 122, 100 134 C100 146, 108 156, 118 160 C130 164, 142 160, 148 150 C154 140, 150 126, 144 120 C138 114, 126 110, 116 112 Z" />

            <!-- Baby's Little Ear -->
            <path d="M118 138 C114 138, 112 134, 114 130 C116 126, 120 126, 122 128" stroke-width="1.8" />

            <!-- Baby's Peaceful Sleeping Lash Line -->
            <path d="M132 134 Q136 138 141 135" stroke-width="1.8" />
            <path d="M139 137 L142 140" stroke-width="1.4" />

            <!-- Baby's Arm Hugging Mother -->
            <path d="M140 152 C138 164, 132 175, 136 184 C140 190, 148 192, 154 190" />

            <!-- Baby's Back & Body extending all the way down to bottom -->
            <path d="M102 152 C92 168, 85 192, 82 215 C79 228, 78 240, 76 250" />
            <path d="M110 160 C108 182, 106 210, 104 250" stroke-width="1.8" />
          </g>
        </svg>
      </div>
    </div>

    <!-- Bottom Dark Wave & Copyright Bar (Directly touches the white section with ZERO gap) -->
    <div class="relative w-full bg-[#531D2C] text-white/80 pt-4 pb-4 px-4">
      <!-- Wave SVG seamlessly connecting -->
      <div class="w-full overflow-hidden leading-none -translate-y-[99%] absolute top-0 left-0 right-0 pointer-events-none">
        <svg class="w-full h-4 text-[#531D2C] fill-current block" viewBox="0 0 1200 30" preserveAspectRatio="none">
          <path d="M0,15 C250,28 500,8 750,22 C1000,32 1150,12 1200,18 L1200,30 L0,30 Z"></path>
        </svg>
      </div>
      <p class="text-[11px] text-center">&copy; 2025 WithTheMums. All rights reserved.</p>
    </div>
  </div>

</body>
</html>
